<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Secure Access</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
/>

<style>

@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0e0e10;
  --surface:#18181c;
  --border:#2a2a32;
  --accent:#7f77dd;
  --accent2:#5dcaa5;
  --text:#f0efe8;
  --muted:#888780;
  --danger:#e24b4a;
  --warn:#ef9f27;
  --success:#97c459;
  --font:'Syne',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}

body{
  background:var(--bg);
  font-family:var(--font);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}

.wrap{
  width:100%;
  max-width:420px;
}

.logo{
  text-align:center;
  margin-bottom:2rem;
}

.logo-mark{
  width:48px;
  height:48px;
  background:linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );
  border-radius:14px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
  color:#fff;
}

.logo h1{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.5px;
}

.logo p{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
  font-family:var(--mono);
}

.card{
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:16px;
  padding:1.75rem;
}

.field{
  margin-bottom:1.1rem;
}

label{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--muted);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  font-family:var(--mono);
}

input[type=text],
input[type=password],
input[type=email]{
  width:100%;
  background:#0e0e10;
  border:0.5px solid var(--border);
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
  color:var(--text);
  font-family:var(--mono);
  outline:none;
  transition:border 0.15s;
}

input:focus{
  border-color:var(--accent);
}

.pw-wrap{
  position:relative;
}

.pw-wrap input{
  padding-right:42px;
}

.eye-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  padding:0;
}

.eye-btn:hover{
  color:var(--text);
}

.btn{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-family:var(--font);
  font-size:14px;
  font-weight:700;
  letter-spacing:0.02em;
  transition:opacity 0.15s,transform 0.1s;
}

.btn:active{
  transform:scale(0.98);
}

.btn-primary{
  background:var(--accent);
  color:#fff;
}

.btn-primary:hover{
  opacity:0.88;
}

.btn-primary:disabled{
  opacity:0.4;
  cursor:not-allowed;
  transform:none;
}

.btn-ghost{
  background:transparent;
  border:0.5px solid var(--border);
  color:var(--muted);
  margin-top:8px;
}

.btn-ghost:hover{
  border-color:var(--accent);
  color:var(--text);
}

.alert{
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  font-family:var(--mono);
  margin-bottom:1rem;
  display:none;
  align-items:flex-start;
  gap:10px;
  line-height:1.5;
}

.alert.show{
  display:flex;
}

.alert-err{
  background:#2a0f0f;
  border:0.5px solid #a32d2d;
  color:#f09595;
}

.alert-warn{
  background:#2a1e0a;
  border:0.5px solid #854f0b;
  color:#fac775;
}

.alert-ok{
  background:#0f1e08;
  border:0.5px solid #3b6d11;
  color:#c0dd97;
}

.attempts-bar{
  margin-bottom:1.1rem;
}

.attempts-label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  font-family:var(--mono);
  margin-bottom:5px;
}

.bar-track{
  background:#1c1c22;
  border-radius:4px;
  height:4px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:4px;
  transition:width 0.3s,background 0.3s;
}

.link-btn{
  background:none;
  border:none;
  color:var(--accent);
  font-family:var(--mono);
  font-size:12px;
  cursor:pointer;
  text-decoration:underline;
  padding:0;
  margin-top:10px;
  display:block;
  text-align:center;
}

.link-btn:hover{
  color:var(--accent2);
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.lockout-box{
  text-align:center;
  padding:1rem 0;
}

.lockout-icon{
  font-size:40px;
  margin-bottom:1rem;
}

.lockout-box h2{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.lockout-box p{
  font-size:13px;
  color:var(--muted);
  font-family:var(--mono);
  margin-bottom:1.2rem;
}

.countdown{
  font-family:var(--mono);
  font-size:28px;
  font-weight:500;
  color:var(--danger);
  margin:0.5rem 0 1.5rem;
  letter-spacing:2px;
}

.success-box{
  text-align:center;
  padding:0.5rem 0;
}

.success-box h2{
  font-size:16px;
  font-weight:700;
  margin-bottom:6px;
}

.divider{
  border:none;
  border-top:0.5px solid var(--border);
  margin:1.2rem 0;
}

.spin{
  display:inline-block;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

</style>

</head>

<body>

<div class="wrap">

  <div class="logo">
    <div class="logo-mark">⬡</div>
    <h1>Secure Access</h1>
    <p>authenticate to continue</p>
  </div>

  <div class="card">

    <!-- LOGIN -->

    <div id="screen-login" class="screen active">

      <div id="alert-login" class="alert alert-err">
        <i class="ti ti-shield-x"></i>
        <span id="alert-login-msg"></span>
      </div>

      <div id="alert-warn" class="alert alert-warn">
        <i class="ti ti-alert-triangle"></i>
        <span id="alert-warn-msg"></span>
      </div>

      <div id="bar-wrap" class="attempts-bar" style="display:none">

        <div class="attempts-label">
          <span>failed attempts</span>
          <span id="bar-label">0 / 20</span>
        </div>

        <div class="bar-track">
          <div
            id="bar-fill"
            class="bar-fill"
            style="width:0%"
          ></div>
        </div>

      </div>

      <div class="field">
        <label for="inp-user">Username</label>

        <input
          type="text"
          id="inp-user"
          autocomplete="username"
          placeholder="your_username"
        />
      </div>

      <div class="field">
        <label for="inp-email">Email</label>

        <input
          type="email"
          id="inp-email"
          autocomplete="email"
          placeholder="teacher@moe.edu.sg"
        />
      </div>

      <div class="field">

        <label for="inp-pass">Password</label>

        <div class="pw-wrap">

          <input
            type="password"
            id="inp-pass"
            autocomplete="current-password"
            placeholder="••••••••"
          />

          <button class="eye-btn" id="eye-toggle">
            <i class="ti ti-eye" id="eye-icon"></i>
          </button>

        </div>

      </div>

      <!-- LOGIN HONEYPOT -->

      <input
        type="checkbox"
        id="login-botcheck"
        style="display:none"
      />

      <!-- LOGIN CAPTCHA -->

      <div
        class="h-captcha"
        data-captcha="true"
        style="margin-bottom:1rem"
      ></div>

      <button class="btn btn-primary" id="btn-login">
        Sign in
      </button>

      <button
        class="link-btn"
        id="btn-show-forgot"
        style="display:none"
      >
        Forgot password?
      </button>

    </div>

    <!-- FORGOT -->

    <div id="screen-forgot" class="screen">

      <div id="alert-forgot" class="alert alert-err">
        <i class="ti ti-alert-circle"></i>
        <span id="alert-forgot-msg"></span>
      </div>

      <div id="alert-forgot-ok" class="alert alert-ok">
        <i class="ti ti-check"></i>
        <span id="alert-forgot-ok-msg"></span>
      </div>

      <p style="font-size:13px;color:var(--muted);font-family:var(--mono);margin-bottom:1.2rem;line-height:1.6">
        Enter your username and registered email to receive a password reset link.
      </p>

      <div class="field">
        <label for="frg-user">Username</label>
        <input type="text" id="frg-user"/>
      </div>

      <div class="field">
        <label for="frg-email">Registered email</label>
        <input type="email" id="frg-email"/>
      </div>

      <!-- FORGOT HONEYPOT -->

      <input
        type="checkbox"
        id="forgot-botcheck"
        style="display:none"
      />

      <!-- FORGOT CAPTCHA -->

      <div
        class="h-captcha"
        data-captcha="true"
        style="margin-bottom:1rem"
      ></div>

      <button class="btn btn-primary" id="btn-send-reset">
        Send reset email
      </button>

      <hr class="divider"/>

      <button class="btn btn-ghost" id="btn-back">
        ← Back to login
      </button>

    </div>

    <!-- SUCCESS -->

    <div id="screen-success" class="screen">

      <div class="success-box">

        <p style="font-size:36px;margin-bottom:0.75rem">
          ✅
        </p>

        <h2>Access granted</h2>

        <p
          style="font-family:var(--mono);font-size:13px;margin-top:6px;color:var(--muted)"
        >
          Welcome back,
          <strong
            id="welcome-user"
            style="color:#5dcaa5"
          ></strong>
          <a href="../user">Enter main page</a>
        </p>

        <hr class="divider"/>

        <button
          class="btn btn-ghost"
          id="btn-logout"
          style="margin-top:0"
        >
          Sign out
        </button>

      </div>

    </div>

  </div>

</div>

<script>

async function sha256(str){

  const buf = await crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(str)
  );

  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,'0'))
    .join('');

}

const USERS = [
  {
    username:"alice",
    email:"alice@example.com",
    hash:"a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3"
  },
  {
    username:"bob",
    email:"bob@example.com",
    hash:"f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7"
  }
];

const WEB3FORMS_KEY = "429a2bca-72b4-48e8-bf79-9c2c6697eb46";

const LS_KEY = "lsys_v3";

const MAX = 20;
const WARN = 9;

const LOCKOUT_MS =
  24 * 60 * 60 * 1000;

let state = (() => {

  try{

    return JSON.parse(
      localStorage.getItem(LS_KEY)
    ) || {
      attempts:0,
      lockedUntil:null
    };

  }catch(e){

    return {
      attempts:0,
      lockedUntil:null
    };

  }

})();

function save(){

  localStorage.setItem(
    LS_KEY,
    JSON.stringify(state)
  );

}

function showScreen(id){

  document.querySelectorAll('.screen')
    .forEach(s => s.classList.remove('active'));

  document.getElementById('screen-' + id)
    .classList.add('active');

}

function showAlert(id,msg){

  const a =
    document.getElementById('alert-' + id);

  const m =
    document.getElementById('alert-' + id + '-msg');

  m.textContent = msg;

  a.classList.add('show');

}

function hideAlert(id){

  document.getElementById('alert-' + id)
    ?.classList.remove('show');

}

function hideLoginAlerts(){

  hideAlert('login');
  hideAlert('warn');

}

function updateBar(){

  const wrap =
    document.getElementById('bar-wrap');

  const fill =
    document.getElementById('bar-fill');

  const lbl =
    document.getElementById('bar-label');

  if(state.attempts > 0){

    wrap.style.display = 'block';

  }

  fill.style.width =
    (state.attempts / MAX * 100) + '%';

  fill.style.background =
    state.attempts >= WARN
      ? '#e24b4a'
      : '#ef9f27';

  lbl.textContent =
    state.attempts + ' / ' + MAX;

}

function checkLockout(){

  if(
    state.lockedUntil &&
    Date.now() < state.lockedUntil
  ){

    showAlert(
      'login',
      'Account locked for 24 hours.'
    );

    return true;

  }

  return false;

}

document.getElementById('btn-show-forgot')
.addEventListener('click', () => {

  showScreen('forgot');

});

document.getElementById('btn-back')
.addEventListener('click', () => {

  showScreen('login');

});

document.getElementById('btn-login')
.addEventListener('click', async () => {

  if(checkLockout()) return;

  hideLoginAlerts();

  const username =
    document.getElementById('inp-user')
      .value.trim().toLowerCase();

  const email =
    document.getElementById('inp-email')
      .value.trim().toLowerCase();

  const password =
    document.getElementById('inp-pass').value;

  if(!username || !email || !password){

    showAlert(
      'login',
      'Please fill in all fields.'
    );

    return;

  }

  // CAPTCHA

  const hCaptcha =
    document.querySelector(
      '#screen-login textarea[name="h-captcha-response"]'
    )?.value;

  if(!hCaptcha){

    showAlert(
      'login',
      'Please complete the captcha.'
    );

    return;

  }

  // HONEYPOT

  const botcheck =
    document.getElementById('login-botcheck')
      .checked;

  if(botcheck){

    showAlert(
      'login',
      'Bot activity detected.'
    );

    return;

  }

  const btn =
    document.getElementById('btn-login');

  btn.disabled = true;

  btn.innerHTML =
    '<span class="spin"><i class="ti ti-loader-2"></i></span> Verifying…';

  const inputHash =
    await sha256(password);

  const user = USERS.find(
    u =>
      u.username.toLowerCase() === username &&
      u.email.toLowerCase() === email &&
      u.hash === inputHash
  );

  btn.disabled = false;
  btn.textContent = 'Sign in';

  if(user){

    state = {
      attempts:0,
      lockedUntil:null
    };

    save();

    document.getElementById('welcome-user')
      .textContent = user.username;

    showScreen('success');

    document.getElementById('bar-wrap')
      .style.display = 'none';

    if(window.hcaptcha){

      hcaptcha.reset();

    }

  }else{

    state.attempts++;

    save();

    updateBar();

    showAlert(
      'login',
      'Invalid username, email, or password.'
    );

    if(state.attempts >= WARN){

      showAlert(
        'warn',

        state.attempts +
        ' failed attempts. ' +
        (MAX - state.attempts) +
        ' remaining before lockout.'
      );

      document.getElementById('btn-show-forgot')
        .style.display = 'block';

    }

    if(state.attempts >= MAX){

      state.lockedUntil =
        Date.now() + LOCKOUT_MS;

      save();

      showAlert(
        'login',
        'Too many failed attempts.'
      );

    }

    if(window.hcaptcha){

      hcaptcha.reset();

    }

  }

});

document.getElementById('btn-send-reset')
.addEventListener('click', async () => {

  hideAlert('forgot');
  hideAlert('forgot-ok');

  const username =
    document.getElementById('frg-user')
      .value.trim().toLowerCase();

  const email =
    document.getElementById('frg-email')
      .value.trim().toLowerCase();

  if(!username || !email){

    showAlert(
      'forgot',
      'Please fill in both fields.'
    );

    return;

  }

  // CAPTCHA

  const hCaptcha =
    document.querySelector(
      '#screen-forgot textarea[name="h-captcha-response"]'
    )?.value;

  if(!hCaptcha){

    showAlert(
      'forgot',
      'Please complete the captcha.'
    );

    return;

  }

  // HONEYPOT

  const botcheck =
    document.getElementById('forgot-botcheck')
      .checked;

  if(botcheck){

    showAlert(
      'forgot',
      'Bot activity detected.'
    );

    return;

  }

  const user = USERS.find(
    u =>
      u.username.toLowerCase() === username &&
      u.email.toLowerCase() === email
  );

  if(!user){

    showAlert(
      'forgot',
      'No account found with that username and email.'
    );

    return;

  }

  const token =
    Math.random()
      .toString(36)
      .slice(2,12)
      .toUpperCase();

  const resetLink =
    'https://docs.google.com/forms/d/e/1FAIpQLSdHSgEIifhGDHlhgzCZ0AxnJN80cz9NHYUoFs50Zl60S8bmYg/viewform?usp=publish-editor' +
    token +
    '&u=' +
    encodeURIComponent(user.username);

  const btn =
    document.getElementById('btn-send-reset');

  btn.disabled = true;

  btn.innerHTML =
    '<span class="spin"><i class="ti ti-loader-2"></i></span> Sending…';

  const formData = new FormData();

  formData.append(
    'access_key',
    WEB3FORMS_KEY
  );

  formData.append(
    'name',
    user.username
  );

  formData.append(
    'email',
    email
  );

  formData.append(
    'subject',
    'Password Reset Request — Secure Access'
  );

  formData.append(
    'message',

    'Hello ' +
    user.username +

    ',\n\n' +

    'Reset link:\n' +
    resetLink +

    '\n\nPlease fill this form and wait.'
  );

  formData.append(
    'from_name',
    'Secure Access'
  );

  formData.append(
    'replyto',
    'yucheng.lee29@gmail.com'
  );

  formData.append(
    'botcheck',
    botcheck ? '1' : ''
  );

  try{

    const res = await fetch(
      'https://api.web3forms.com/submit',
      {
        method:'POST',
        body:formData
      }
    );

    const data = await res.json();

    if(data.success){

      showAlert(
        'forgot-ok',
        'Reset email sent to ' +
        email +
        '.'
      );

      if(window.hcaptcha){

        hcaptcha.reset();

      }

    }else{

      showAlert(
        'forgot',
        'Send failed.'
      );

    }

  }catch(err){

    showAlert(
      'forgot',
      'Network error.'
    );

  }

  btn.disabled = false;
  btn.textContent = 'Send reset email';

});

document.getElementById('btn-logout')
.addEventListener('click', () => {

  showScreen('login');

});

document.getElementById('eye-toggle')
.addEventListener('click', () => {

  const inp =
    document.getElementById('inp-pass');

  const icon =
    document.getElementById('eye-icon');

  inp.type =
    inp.type === 'password'
      ? 'text'
      : 'password';

  icon.className =
    inp.type === 'password'
      ? 'ti ti-eye'
      : 'ti ti-eye-off';

});

updateBar();

</script>

<script
  src="https://web3forms.com/client/script.js"
  async
  defer
></script>

</body>

</html>
